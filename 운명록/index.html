<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운명록</title>
  <!-- CSS 연결 -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- =====================================
       운명록 첫 화면
  ====================================== -->

  <section class="hero">
    <div class="content">

      <!-- 작은 영어 제목 -->
      <p class="small-title">
        THE RECORD OF YOUR DESTINY
      </p>

      <!-- 메인 제목 -->
      <h1>
        운명록
      </h1>

      <!-- 한자 제목 -->
      <p class="hanja">
        運 命 錄
      </p>

      <!-- 운명록 소개 문구 -->
      <p class="message">
        「나의 운명이 기록된 서적」,<br>
        태어난 순간부터 시작된, 나의 운명이 기록된 책.<br><br>
        아직 펼쳐보지 않았을 뿐,<br>
        당신의 이야기는 이미 시작되었습니다.<br>
      </p>


      <!-- 운명록 시작 버튼 -->
      <a href="#start" class="start-button">
        운명록 펼치기
      </a>
    </div>
  </section>

  <!-- =====================================
       다음 화면
  ====================================== -->

  <section id="start">
    <!--
      다음 단계에서 여기에
      이름
      생년월일
      태어난 시간
      출생지
      성별
      입력하는 화면을 만들 예정
    -->
  </section>
</body>
</html>
